name: Ansible and Ubuntu lab checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ansible tools
        run: python -m pip install ansible ansible-lint
      - name: Lint playbook
        run: ansible-lint ansible/playbook.yml
      - name: Check playbook syntax
        run: ansible-playbook -i localhost, -c local ansible/playbook.yml --syntax-check
      - name: Verify settings in disposable Ubuntu container
        run: docker run --rm -v "$PWD:/work:ro" ubuntu:22.04 bash /work/tests/lab.sh
